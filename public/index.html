<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MovieMatch</title>
    <meta name="description" content="Swipe trailers. Match with friends. Watch something tonight." />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0b10;
        color: #f4f4f6;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 34rem; }
      h1 { margin: 0 0 0.4em; font-size: clamp(2.25rem, 9vw, 3.5rem); letter-spacing: -0.03em; }
      p { margin: 0 0 1.25em; color: #a9a9b8; }
      .tag {
        display: inline-block;
        padding: 0.35em 0.9em;
        border: 1px solid #2a2a38;
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7c7c90;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MovieMatch</h1>
      <p>Swipe trailers. Match with friends. Watch something tonight.</p>
      <!-- Placeholder for issue #2. Issue #33 replaces this with the real
           landing page and the /j/{code} join route on the .tech domain. -->
      <span class="tag">Hosting placeholder</span>
    </main>
  </body>
</html>
